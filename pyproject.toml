[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "advanced-static-analyzer"
version = "2.0.0"
description = "Universal Static Malware Forensics Analyzer & Rapid Triage Tool"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Rashid Dewewe", email = "shantidewewe35@gmail.com" }
    ]
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
dependencies = [
    "pefile",
    "python-magic; platform_system != 'Windows'",
    "python-magic-bin; platform_system == 'Windows'",
    "pyfiglet",
    "flare-floss",
    "rich",
    "yara-python"
]

[project.scripts]
static-analyzer = "static_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["static_analyzer*"]