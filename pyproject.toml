[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "advanced-static-analyzer"
version = "2.0.0"
description = "Universal Static Malware Forensics Analyzer & Rapid Triage Tool"
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Rashid Dewewe" }]
dependencies = [
    "pefile",
    "python-magic; platform_system != 'Windows'",
    "python-magic-bin; platform_system == 'Windows'",
    "pyfiglet",
    "flare-floss",
    "rich",
    "yara-python"
]

[project.scripts]
static-analyzer = "static_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["static_analyzer*"]